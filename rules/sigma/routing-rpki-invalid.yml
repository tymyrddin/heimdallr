title: RPKI-invalid BGP announcement
status: experimental
description: >
  An announcement that is RPKI-invalid by origin validation (RFC 6811): a covering
  ROA exists in the observed VRP set, but the announcement violates it (wrong
  origin, or more specific than maxLength). Validity is derived by the routing
  ingest pipeline against the bundle's observed VRPs; this rule matches the
  derived verdict.
logsource:
  product: routing
detection:
  selection:
    type: announce
    rpki_validity: invalid
  condition: selection
fields:
  - prefix
  - origin_as
  - covering_aggregate
level: medium
