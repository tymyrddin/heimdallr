title: BGP announcement of a monitored prefix from an unauthorised origin
status: experimental
description: >
  An announcement that falls within a monitored aggregate but is not from that
  aggregate's registered origin (a MOAS / origin hijack). The routing ingest
  pipeline derives origin_authorised by comparing the announced origin to the
  aggregate's origin in rules/baseline/aggregates.json, so this rule keys off a
  single-sourced signal rather than re-listing prefixes or origins.
logsource:
  product: routing
detection:
  in_monitored_space:
    type: announce
    covering_aggregate: "*"
  unauthorised:
    origin_authorised: false
  condition: in_monitored_space and unauthorised
fields:
  - prefix
  - origin_as
  - covering_aggregate
  - rpki_validity
level: high
