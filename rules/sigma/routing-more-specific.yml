title: BGP more-specific announcement within a monitored aggregate
status: experimental
description: >
  An announcement more specific than its covering monitored aggregate, announced
  from within that aggregate's address space. The routing ingest pipeline derives
  more_specific size-generically (longer than the covering aggregate, against
  rules/baseline/aggregates.json), so this rule carries no hardcoded prefix length
  and no prefix list: it generalises to any monitored aggregate of any size.
logsource:
  product: routing
detection:
  selection:
    type: announce
    more_specific: true
  condition: selection
fields:
  - prefix
  - origin_as
  - covering_aggregate
  - rpki_validity
level: high
