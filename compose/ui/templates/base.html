<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>heimdallr {% block title %}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <header class="topbar">
    <span class="brand">heimdallr</span>
    <nav>
      <a href="{{ url_for('data') }}" class="{{ 'on' if request.path.startswith('/data') or request.path.startswith('/bundles') }}">Data</a>
      <a href="{{ url_for('detections') }}" class="{{ 'on' if request.path.startswith('/detections') }}">Detections</a>
      <a href="{{ url_for('findings') }}" class="{{ 'on' if request.path.startswith('/findings') }}">Findings</a>
      <a href="{{ url_for('experiments') }}" class="{{ 'on' if request.path.startswith('/experiments') }}">Experiments</a>
    </nav>
    <span class="stack {{ 'up' if stack_up else 'down' }}">
      {{ 'OpenSearch up' if stack_up else 'OpenSearch down' }}
    </span>
  </header>

  {% if active_jobs %}
  <div class="jobs-banner" data-poll="1">
    {% for j in active_jobs %}
      <span class="job {{ j.status }}">{{ j.label }} &middot; {{ j.status }}</span>
    {% endfor %}
  </div>
  {% endif %}

  <main>
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
