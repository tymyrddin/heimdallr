# heimdallr running range: OpenSearch + Sigma detection lab.
#
# One persistent stack: an OpenSearch node (the data lake + detection engine, via
# the Security Analytics and Alerting plugins) and OpenSearch Dashboards (the hunt
# and alert surface). The routing feeder is an on-demand sensor that relays raw
# routing observations into OpenSearch.
#
# Security: the auth/TLS plugin is disabled. heimdallr is a local detection range,
# not an exposed service; disabling it keeps the lab single-command and avoids the
# certificate machinery. Do not expose these ports off the host.

name: heimdallr

services:
  opensearch:
    image: opensearchproject/opensearch:2.18.0
    hostname: opensearch
    restart: always
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - bootstrap.memory_lock=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    networks: [heimdallr]

  dashboards:
    image: opensearchproject/opensearch-dashboards:2.18.0
    hostname: dashboards
    restart: always
    depends_on: [opensearch]
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "5601:5601"
    networks: [heimdallr]

  # Routing sensor. BGP is not pcap-shaped, so the feeder stands in for a packet
  # sensor: it reads the raw routing telemetry under /ingest and bulk-loads the
  # observations into OpenSearch through the routing ingest pipeline. Run on
  # demand by `ctl ingest` (profile sensors), parallel to how offline sensors run.
  routing:
    build: ../feeders
    image: heimdallr-routing
    profiles: ["sensors"]
    depends_on: [opensearch]
    environment:
      - OPENSEARCH_URL=http://opensearch:9200
    volumes:
      - ../ingest:/ingest:ro
    networks: [heimdallr]

  # heimdallr UI. The Flask surface: Data / Detections / Findings / Experiments.
  # Built from the repo root so it can carry the shared feeder + pipeline logic as
  # the single source of truth. Mounts rules/ read-write (the rule editor) and
  # ingest/ read-only (the bundle explorer); reads and writes OpenSearch over HTTP.
  ui:
    build:
      context: ..
      dockerfile: compose/ui/Dockerfile
    image: heimdallr-ui
    hostname: ui
    restart: always
    depends_on: [opensearch]
    environment:
      - OPENSEARCH_URL=http://opensearch:9200
    volumes:
      - ../rules:/rules
      - ../ingest:/ingest:ro
    ports:
      - "5000:5000"
    networks: [heimdallr]

  # Routing detector. Compiles the Sigma rules with pySigma and runs them, plus
  # the engine-form arm->hijack correlation. Run on demand by `ctl detect`.
  routing-detector:
    build: ./detector
    image: heimdallr-detector
    profiles: ["sensors"]
    depends_on: [opensearch]
    environment:
      - OPENSEARCH_URL=http://opensearch:9200
    volumes:
      - ../rules:/rules:ro
    networks: [heimdallr]

networks:
  heimdallr:
    driver: bridge

volumes:
  opensearch-data: