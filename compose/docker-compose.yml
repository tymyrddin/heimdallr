# heimdallr running range: OpenSearch + Sigma detection lab.
#
# One persistent stack: an OpenSearch node (the data lake + detection engine) and
# OpenSearch Dashboards (the hunt and alert surface). Load datasets via the UI;
# run Sigma detections via the UI or `ctl detect`.
#
# Security: the auth/TLS plugin is disabled. heimdallr is a local detection range,
# not an exposed service; disabling it keeps the lab single-command and avoids the
# certificate machinery. Do not expose these ports off the host.

name: heimdallr

services:
  opensearch:
    image: opensearchproject/opensearch:2.18.0
    hostname: opensearch
    restart: always
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - bootstrap.memory_lock=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    networks: [heimdallr]

  dashboards:
    image: opensearchproject/opensearch-dashboards:2.18.0
    hostname: dashboards
    restart: always
    depends_on: [opensearch]
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "5601:5601"
    networks: [heimdallr]

  # heimdallr UI. The Flask surface: Data / Detections / Findings / Experiments.
  # Mounts rules/ read-write (the rule editor) and ingest/ read-only (the dataset
  # explorer); reads and writes OpenSearch over HTTP.
  ui:
    build:
      context: ..
      dockerfile: compose/ui/Dockerfile
    image: heimdallr-ui
    hostname: ui
    restart: always
    depends_on: [opensearch]
    environment:
      - OPENSEARCH_URL=http://opensearch:9200
    volumes:
      - ../rules:/rules
      - ../ingest:/ingest:ro
    ports:
      - "5000:5000"
    networks: [heimdallr]

  # Sigma detector. Compiles every rule in rules/sigma with pySigma and runs them
  # against the logs index. Run on demand by `ctl detect`.
  detector:
    build: ./detector
    image: heimdallr-detector
    profiles: ["sensors"]
    depends_on: [opensearch]
    environment:
      - OPENSEARCH_URL=http://opensearch:9200
    volumes:
      - ../rules:/rules:ro
    networks: [heimdallr]

networks:
  heimdallr:
    driver: bridge

volumes:
  opensearch-data: