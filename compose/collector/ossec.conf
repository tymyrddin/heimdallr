<ossec_config>
  <client>
    <server>
      <address>wazuh.manager</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <enrollment>
      <enabled>yes</enabled>
      <manager_address>wazuh.manager</manager_address>
      <port>1515</port>
    </enrollment>
  </client>

  <!-- heimdallr: the collector only ships sensor logs, so the agent's own
       host-monitoring modules are off. It runs logcollector and nothing else. -->
  <rootcheck>
    <disabled>yes</disabled>
  </rootcheck>
  <syscheck>
    <disabled>yes</disabled>
  </syscheck>
  <sca>
    <enabled>no</enabled>
  </sca>
  <wodle name="syscollector">
    <disabled>yes</disabled>
  </wodle>

  <!--
    The agent tails per-source stream files under /var/log/heimdallr/stream.
    These are pre-created empty by `ctl up`, so logcollector starts following
    them from offset zero, and the sensors append their per-run output. This
    sidesteps Wazuh's batch blind spot: a file written all at once before
    logcollector discovers it is otherwise tailed from the end and skipped.
    See sensors/*/entrypoint.sh (the append) and ctl `_ensure_stream`.
  -->

  <localfile>
    <log_format>json</log_format>
    <location>/var/log/heimdallr/stream/suricata.json</location>
    <only-future-events>no</only-future-events>
  </localfile>

  <localfile>
    <log_format>json</log_format>
    <location>/var/log/heimdallr/stream/zeek.json</location>
    <only-future-events>no</only-future-events>
  </localfile>

  <localfile>
    <log_format>json</log_format>
    <location>/var/log/heimdallr/stream/routing.json</location>
    <only-future-events>no</only-future-events>
  </localfile>

  <localfile>
    <log_format>json</log_format>
    <location>/var/log/heimdallr/stream/host.json</location>
    <only-future-events>no</only-future-events>
  </localfile>
</ossec_config>
